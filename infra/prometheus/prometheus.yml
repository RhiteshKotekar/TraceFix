global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # The demo shop backend running on the host (npm start in waymark-target-shop/backend).
  - job_name: shop-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5002"]
        labels:
          service: shop-backend
