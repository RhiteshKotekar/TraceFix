services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: waymark
      POSTGRES_PASSWORD: waymark_dev_only
      POSTGRES_DB: waymark
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-shop-db.sql:/docker-entrypoint-initdb.d/10-shop.sql:ro
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3001:3000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
volumes:
  pgdata:
