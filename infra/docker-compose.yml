# TraceFix's own database. Prometheus and Grafana are not part of TraceFix: point
# PROMETHEUS_URL and GRAFANA_URL in .env at the ones you already run.
# From the repo root: npm run db:up
name: tracefix

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tracefix
      POSTGRES_PASSWORD: tracefix_dev_only
      POSTGRES_DB: tracefix
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run only when the volume is first created.
      - ./postgres/00-shop-db.sql:/docker-entrypoint-initdb.d/00-shop-db.sql:ro
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracefix -d tracefix"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
